name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      # Works for https://<user>.github.io/<repo> and https://<user>.github.io.
      # Using a custom domain? Set repository variables SITE_URL (e.g. https://example.com) and leave BASE_PATH empty.
      - name: Work out the site URL and base path
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          BASE_PATH_OVERRIDE: ${{ vars.BASE_PATH }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SITE_URL_OVERRIDE" ]; then
            BASE="$BASE_PATH_OVERRIDE"
            SITE="$SITE_URL_OVERRIDE"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE=""
            SITE="https://${OWNER}.github.io"
          else
            BASE="/${REPO}"
            SITE="https://${OWNER}.github.io/${REPO}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${BASE}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${SITE}" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
